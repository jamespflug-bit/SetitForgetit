<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set It and Forget It Draft Board</title>
<meta name="theme-color" content="#ECEAE1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12150F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!--
  This file is the shell. It holds no app code on purpose.

  Phones that save the site to the home screen cache whatever index.html said the
  day they saved it, and never ask again. So index.html says almost nothing: it
  fetches app.html fresh on every launch and runs it. Updating the app means
  committing app.html. This file should never need to change again.
-->
<style>
html{color-scheme:light dark}
body{margin:0;background:#ECEAE1;color:#191C17;
  font-family:Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){body{background:#12150F;color:#ECEBE0}}
img{max-width:100%}
[hidden]{display:none!important}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;padding:24px;text-align:center}
#boot .mark{font-family:'Big Shoulders Display',Archivo,sans-serif;font-weight:800;
  font-size:clamp(30px,7vw,54px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase}
#boot .mark em{font-style:normal;color:#B8860B}
@media (prefers-color-scheme:dark){#boot .mark em{color:#F2C023}}
#boot .rule{width:min(240px,60vw);height:3px;background:rgba(25,28,23,.14);overflow:hidden;border-radius:2px}
@media (prefers-color-scheme:dark){#boot .rule{background:rgba(255,255,255,.14)}}
#boot .rule i{display:block;width:40%;height:100%;background:#B8860B;animation:slide 1.05s ease-in-out infinite}
@media (prefers-color-scheme:dark){#boot .rule i{background:#F2C023}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
#bootnote{font-size:14px;line-height:1.5;max-width:30ch;color:#6C7266}
@media (prefers-color-scheme:dark){#bootnote{color:#8B9382}}
#boot button{font:600 15px/1 Archivo,sans-serif;padding:11px 18px;border-radius:4px;
  border:1px solid rgba(25,28,23,.3);background:transparent;color:inherit;cursor:pointer;margin-top:12px}
@media (prefers-reduced-motion:reduce){#boot .rule i{animation:none;width:100%}}
</style>
</head>
<body>

<div id="boot">
  <div class="mark">Set It <em>&amp;</em><br>Forget It</div>
  <div class="rule"><i></i></div>
  <div id="bootnote">Loading the board&hellip;</div>
</div>

<script>
(function(){
  "use strict";
  var SRC    = "app.html";
  var KEY    = "sifi-shell-cache-v1";
  var COLD   = 9000;   // no saved copy to fall back on: wait it out
  var WARM   = 1400;   // saved copy available: show it fast, keep fetching
  var SWAP   = 9000;   // if the fresh copy lands within this, swap to it silently

  var started = Date.now();
  var booted  = null;         // text of whatever we booted

  /* One swap per launch, ever. Cheap insurance against a reload loop if the
     saved copy can no longer be written (private mode, full quota). */
  function swapOnce(){
    try{
      if(sessionStorage.getItem("sifi-swapped")) return false;
      sessionStorage.setItem("sifi-swapped","1");
    }catch(e){}
    return true;
  }

  function note(html){
    var n = document.getElementById("bootnote");
    if(n) n.innerHTML = html;
  }
  function cached(){
    try{ return localStorage.getItem(KEY); }catch(e){ return null; }
  }
  function stash(t){
    try{ if(localStorage.getItem(KEY) !== t) localStorage.setItem(KEY, t); }catch(e){}
  }

  /* Runs the fetched document inside this one. Scripts parsed by DOMParser are
     inert by spec, so each one is re-created before it will execute. */
  function run(text, from){
    var doc;
    try{ doc = new DOMParser().parseFromString(text, "text/html"); }
    catch(e){ return false; }
    if(!doc || !doc.body) return false;

    var i, n, tag, scripts = [], frag = document.createDocumentFragment();

    var heads = [].slice.call(doc.head ? doc.head.childNodes : []);
    for(i=0;i<heads.length;i++){
      n = heads[i];
      if(n.nodeType !== 1) continue;
      tag = n.tagName.toLowerCase();
      if(tag === "title" || tag === "meta") continue;      // the shell already set these
      if(tag === "script"){ scripts.push(n); continue; }
      document.head.appendChild(document.adoptNode(n));    // link, style
    }

    var kids = [].slice.call(doc.body.childNodes);
    for(i=0;i<kids.length;i++){
      n = kids[i];
      if(n.nodeType === 1){
        tag = n.tagName.toLowerCase();
        if(tag === "title") continue;
        if(tag === "link" || tag === "style"){ document.head.appendChild(document.adoptNode(n)); continue; }
        if(tag === "script"){ scripts.push(n); continue; }
      }
      frag.appendChild(document.adoptNode(n));
    }

    var splash = document.getElementById("boot");
    if(splash && splash.parentNode) splash.parentNode.removeChild(splash);
    document.body.appendChild(frag);

    for(i=0;i<scripts.length;i++){
      var s  = scripts[i];
      var el = document.createElement("script");
      if(s.id) el.id = s.id;
      var ty = s.getAttribute("type");
      if(ty) el.setAttribute("type", ty);
      el.textContent = s.textContent;
      document.body.appendChild(el);
    }

    document.documentElement.setAttribute("data-shell", from);
    booted = text;
    return true;
  }

  function looksRight(t){
    return typeof t === "string" && t.length > 5000 && t.indexOf('id="season-data"') > -1;
  }

  function fallback(msg){
    if(booted) return;
    var c = cached();
    if(looksRight(c) && run(c, "cache")) return;
    note(msg + '<button type="button" id="retry">Try again</button>');
    var r = document.getElementById("retry");
    if(r) r.onclick = function(){ location.reload(); };
  }

  var haveCache = looksRight(cached());
  var timer = setTimeout(function(){
    if(booted) return;
    fallback(haveCache ? "" : "Could not reach the site. Check the connection and try again.");
  }, haveCache ? WARM : COLD);

  function ask(){
    return fetch(SRC + "?_=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); });
  }

  ask().then(function(t){
    if(!looksRight(t)) throw new Error("unexpected payload");
    stash(t);
    clearTimeout(timer);
    if(!booted){ run(t, "network"); return; }
    /* The saved copy went up while this was in flight. If it turned out to be
       stale and we are still in the first seconds of the launch, quietly take
       the new one — but only if it really did get saved, and only once. */
    if(t !== booted && Date.now() - started < SWAP && cached() === t && swapOnce())
      location.reload();
  }).catch(function(){
    clearTimeout(timer);
    fallback("Could not reach the site. Check the connection and try again.");
  });
})();
</script>

</body>
</html>
