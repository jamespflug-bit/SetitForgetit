<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Set It and Forget It Draft Board</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#ECEAE1; --surface:#F8F7F2; --surface-2:#E3E1D6;
  --ink:#191C17; --ink-soft:#3E4439; --muted:#6C7266;
  --rule:#D3D1C5; --rule-strong:#B6B4A6;
  --flag:#E0A800; --flag-ink:#231A00;
  --shadow:0 1px 0 rgba(25,28,23,.06), 0 8px 22px -16px rgba(25,28,23,.5);
  --tile-edge:rgba(0,0,0,.18);
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12150F; --surface:#1A1E16; --surface-2:#232819;
    --ink:#ECEBE0; --ink-soft:#C6C8B9; --muted:#8B9382;
    --rule:#2E331F; --rule-strong:#454B33;
    --flag:#F2C023; --flag-ink:#1A1400;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,1);
    --tile-edge:rgba(255,255,255,.16);
  }
}
:root[data-theme="dark"]{
  --ground:#12150F; --surface:#1A1E16; --surface-2:#232819;
  --ink:#ECEBE0; --ink-soft:#C6C8B9; --muted:#8B9382;
  --rule:#2E331F; --rule-strong:#454B33;
  --flag:#F2C023; --flag-ink:#1A1400;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,1);
  --tile-edge:rgba(255,255,255,.16);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
.disp,h1,h2{font-family:'Big Shoulders Display','Archivo Narrow','Archivo',Impact,sans-serif;font-weight:800;margin:0;letter-spacing:.01em}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px}

.app{height:100vh;display:flex;flex-direction:column;gap:10px;padding:10px 14px 12px}

/* ---------- bar ---------- */
.bar{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);font-weight:700}
.brandmark{font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:22px;line-height:1;text-transform:uppercase}
.brandmark em{font-style:normal;color:var(--muted)}
.spacer{flex:1 1 auto}
.tabs{display:flex;gap:4px;margin-left:22px;align-self:stretch;align-items:center}
.tab{
  background:transparent;border:1px solid transparent;border-radius:4px;padding:6px 15px;
  font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:21px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted);line-height:1;
  transition:color .15s,background .15s,border-color .15s;
}
.tab:hover{color:var(--ink);border-color:var(--rule)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tab.locked{opacity:.42}
.tab.locked::after{content:" 🔒";font-size:12px}
.btn{background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--r);padding:6px 11px;font-weight:600;font-size:12px;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--flag);border-color:var(--flag);color:var(--flag-ink)}
.btn.ghost{background:transparent}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* ---------- clock strip ---------- */
.clock{
  flex:0 0 auto;display:flex;align-items:center;gap:26px;
  background:var(--flag);color:var(--flag-ink);border-radius:var(--r);padding:10px 22px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:126px;
}
.clock::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 1px,transparent 1px 76px);
}
.clock.done{background:var(--surface);color:var(--ink);border:1px solid var(--rule)}
.clock.done::after{opacity:.35}
.clock-label{font-size:14px;text-transform:uppercase;letter-spacing:.22em;font-weight:800;opacity:.72}
.clock-name{
  font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;
  font-size:clamp(56px,5.2vw,96px);line-height:.84;text-transform:uppercase;position:relative;z-index:1;margin-top:2px;
}
.clock-big{font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:clamp(28px,2.4vw,44px);line-height:.92;text-transform:uppercase;margin-top:3px}
.clock-meta{font-size:17px;font-weight:600;opacity:.85;margin-top:2px}
.clock-timer{font-size:38px;font-weight:500;line-height:1}
.clock-count{font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:46px;line-height:.9}
.clock-right{text-align:right;position:relative;z-index:1}
.lastchip{display:inline-block;width:16px;height:16px;border-radius:3px;vertical-align:-2px;margin-right:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.nameroll{animation:nameroll .42s cubic-bezier(.16,.9,.3,1)}
@keyframes nameroll{from{opacity:0;transform:translateY(16px) skewY(2deg)}to{opacity:1;transform:none}}
.snakearrow{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;font-weight:600;
  opacity:.75;position:relative;z-index:1;
}

/* ---------- stage ---------- */
.stage{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;min-width:0}
.phead{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.phead h2{font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.note{color:var(--muted);font-size:14px;font-weight:600}
.livedot{
  font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--good);
  display:inline-flex;align-items:center;gap:6px;
}
.livedot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);animation:blip 2s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- board ---------- */
.boardwrap{flex:1 1 auto;min-height:0;overflow:auto;padding:6px 8px 8px}
.bgrid{display:grid;gap:5px;height:100%;min-height:340px}
.bhead{display:contents}
.bhead > div{
  font-size:14px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft);font-weight:800;
  padding:2px 6px 5px;border-bottom:2px solid var(--rule-strong);align-self:end;
}
.bhead .dir{font-size:11px;letter-spacing:.06em;opacity:.7;display:block;font-weight:600;color:var(--muted)}

.orow{display:contents}
.owner{
  padding:5px 8px 5px 10px;border-radius:3px;position:relative;
  display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  transition:background .25s ease;
}
.owner::before{
  content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;
  background:var(--rule-strong);transform:scaleY(.35);transform-origin:center;transition:transform .3s,background .3s;
}
.owner.live::before{background:var(--flag);transform:scaleY(1)}
.owner.live{background:color-mix(in srgb,var(--flag) 10%,transparent)}
.oname{font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:42px;line-height:.92;text-transform:uppercase;display:inline-block;max-width:100%;overflow:hidden;white-space:nowrap;vertical-align:bottom}
.oseed{
  font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:20px;color:var(--ground);
  background:var(--rule-strong);border-radius:3px;padding:1px 7px;margin-right:8px;vertical-align:4px;
}
.owner.live .oseed{background:var(--flag);color:var(--flag-ink)}
.osub{font-size:12.5px;color:var(--muted);line-height:1.25;margin-top:3px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.paper{
  margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;
  border:1px solid var(--rule-strong);border-radius:3px;padding:1px 7px;color:var(--ink-soft);align-self:flex-start;
}
.paper.lead{border-color:var(--flag);color:var(--ink);background:color-mix(in srgb,var(--flag) 20%,transparent)}

.cell{position:relative;border-radius:3px;overflow:hidden;min-height:0}
.cell.empty{border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center}
.cell.empty .pno{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--muted);opacity:.55}
.cell.next{
  border:2px solid var(--flag);border-style:solid;
  background:color-mix(in srgb,var(--flag) 12%,transparent);
}
.cell.next::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 40%,color-mix(in srgb,var(--flag) 45%,transparent) 50%,transparent 60%);
  background-size:260% 100%;animation:sweep 2.4s linear infinite;
}
@keyframes sweep{from{background-position:140% 0}to{background-position:-140% 0}}
.cell.next .pno{color:var(--ink);opacity:1;font-weight:700;letter-spacing:.12em;font-size:16px;position:relative;z-index:1}

.pick{position:absolute;inset:0;background:var(--ground);border:1px solid var(--rule);border-radius:3px;padding:6px 9px 6px 18px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.pick .sw{position:absolute;left:0;top:0;bottom:0;width:11px;box-shadow:inset -1px 0 0 rgba(128,128,128,.4)}
.pick .sw i{position:absolute;left:0;right:0;top:52%;bottom:0}
.pick .pnum{position:absolute;right:6px;top:3px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);opacity:.65}
.pick .tname{font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:38px;line-height:.94;text-transform:uppercase;white-space:nowrap;display:block;overflow:hidden}
.pick .trec{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;color:var(--ink-soft);margin-top:2px}
.pick.fresh{animation:pickin .5s cubic-bezier(.2,.85,.3,1) both}
@keyframes pickin{
  0%{clip-path:inset(0 100% 0 0);transform:translateX(-6px)}
  100%{clip-path:inset(0 0 0 0);transform:none}
}

/* ---------- pool ---------- */
.poolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.poolbar input{flex:1;background:var(--ground);border:1px solid var(--rule);border-radius:3px;padding:8px 12px;font-size:16px}
.chip{background:transparent;border:1px solid var(--rule);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.sortbar{display:flex;gap:5px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.fieldlab{font-size:9.5px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:700}

.pool{
  flex:1 1 auto;min-height:0;overflow:auto;padding:8px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
  grid-auto-rows:minmax(80px,1fr);gap:8px;align-content:stretch;
}
.tile{
  position:relative;border:0;border-radius:5px;padding:9px 12px;text-align:left;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  box-shadow:inset 0 0 0 1px var(--tile-edge), 0 1px 3px rgba(0,0,0,.18);
  transition:transform .16s cubic-bezier(.2,.9,.3,1), box-shadow .16s, filter .3s;
  will-change:transform;
}
.tile:hover{transform:translateY(-3px) scale(1.02);box-shadow:inset 0 0 0 1px var(--tile-edge),0 8px 18px -6px rgba(0,0,0,.45);z-index:2}
.tile .wedge{position:absolute;right:-30px;top:-30px;width:96px;height:96px;transform:rotate(45deg);opacity:.9}
.tile .abbr{display:none}
.tile .tn{font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:42px;line-height:.9;text-transform:uppercase;position:relative;text-shadow:0 1px 3px rgba(0,0,0,.32);white-space:nowrap;display:block;overflow:hidden}
.tile .foot{display:flex;align-items:baseline;gap:8px;position:relative;white-space:nowrap;overflow:hidden}
.tile .rec{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600}
.tile .post{font-size:11px;text-transform:uppercase;letter-spacing:.09em;opacity:.8;font-weight:700}
.tile .jab{
  position:absolute;left:0;right:0;bottom:0;padding:8px 11px;font-size:13px;line-height:1.28;
  background:linear-gradient(0deg,rgba(0,0,0,.86),rgba(0,0,0,.55) 70%,transparent);
  color:#fff;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;
}
.tile:hover .jab{opacity:1;transform:none}
.tile.hit{box-shadow:inset 0 0 0 2px var(--flag),0 8px 18px -6px rgba(0,0,0,.45);transform:translateY(-3px) scale(1.02)}
.tile.gone{display:none}
.tile.claiming{animation:claim .95s cubic-bezier(.2,.8,.3,1) both}
@keyframes claim{
  0%{transform:scale(1)}
  18%{transform:scale(1.07) rotate(-1.2deg)}
  55%{transform:scale(1.03) rotate(.4deg);filter:saturate(.4) brightness(.8)}
  100%{transform:scale(.72) rotate(0);filter:saturate(0) brightness(.55);opacity:0}
}
.tile .stamp{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:38px;
  text-transform:uppercase;letter-spacing:.06em;color:#fff;
  background:rgba(0,0,0,.42);opacity:0;transform:scale(1.6) rotate(-8deg);
}
.tile.claiming .stamp{animation:stampin .95s cubic-bezier(.2,.8,.3,1) both}
@keyframes stampin{
  0%{opacity:0;transform:scale(1.8) rotate(-10deg)}
  22%{opacity:1;transform:scale(1) rotate(-6deg)}
  70%{opacity:1;transform:scale(1) rotate(-6deg)}
  100%{opacity:0;transform:scale(.9) rotate(-6deg)}
}
.tile.taken-shown{filter:saturate(.12) brightness(.72)}
.tile.taken-shown .owned{
  position:absolute;inset:auto 0 0 0;padding:5px 10px;background:rgba(0,0,0,.6);color:#fff;
  font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
}
.tile.taken-shown:hover{transform:none;box-shadow:inset 0 0 0 1px var(--tile-edge)}
.pool-empty{grid-column:1/-1;padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- announcement ---------- */
.announce{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(8,10,7,.62);backdrop-filter:blur(2px);animation:fadein .2s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.announce.out{animation:fadeout .28s both}
@keyframes fadeout{to{opacity:0}}
.anncard{
  position:relative;width:min(680px,86vw);border-radius:8px;overflow:hidden;padding:26px 32px 34px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.75);animation:anncard .5s cubic-bezier(.15,.9,.25,1) both;
}
@keyframes anncard{from{opacity:0;transform:translateY(26px) scale(.94) rotate(-.6deg)}to{opacity:1;transform:none}}
.anncard .wedge2{position:absolute;right:0;top:0;bottom:0;width:34%;clip-path:polygon(46% 0,100% 0,100% 100%,0 100%);opacity:.92}
.ann-owner{font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;opacity:.85;position:relative;animation:annline .5s .1s both}
.ann-team{font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:clamp(44px,6.6vw,74px);max-width:66%;line-height:.86;text-transform:uppercase;position:relative;margin-top:4px;text-shadow:0 2px 10px rgba(0,0,0,.3);animation:annline .55s .16s both}
.ann-city{font-size:15px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;opacity:.8;position:relative;animation:annline .5s .13s both}
.ann-meta{margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:13px;opacity:.9;position:relative;animation:annline .5s .24s both}
.ann-jab{margin-top:10px;font-size:13.5px;line-height:1.4;max-width:46ch;opacity:.95;position:relative;animation:annline .5s .3s both}
.ann-round{
  margin-top:16px;display:inline-block;padding:5px 12px;border-radius:20px;position:relative;
  font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  background:rgba(0,0,0,.3);animation:annline .5s .38s both;
}
@keyframes annline{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ann-hint{position:absolute;left:32px;bottom:9px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.5}

#confetti{position:fixed;inset:0;z-index:55;pointer-events:none}

/* ---------- setup ---------- */
.setupwrap{flex:1 1 auto;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:8px}
.setup{width:min(820px,100%)}
.setup-head{padding:20px 24px 14px;border-bottom:1px solid var(--rule)}
.setup-head h1{font-size:clamp(30px,4.4vw,50px);line-height:.92;text-transform:uppercase}
.setup-head p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.setup-body{padding:16px 24px 22px;display:flex;flex-direction:column;gap:14px}
.slot-list{display:flex;flex-direction:column;gap:5px}
.slot{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;background:var(--ground);border:1px solid var(--rule);border-radius:var(--r);padding:4px 8px 4px 0}
.slot.settled{animation:settle .5s cubic-bezier(.2,.9,.25,1)}
@keyframes settle{0%{transform:translateX(-14px) scale(1.02);background:var(--flag);border-color:var(--flag)}100%{transform:none}}
.slot-no{font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:21px;text-align:center;color:var(--muted);border-right:1px solid var(--rule);padding:2px 0}
.slot input{width:100%;background:transparent;border:0;padding:6px 4px;font-size:15px;font-weight:600}
.mini{background:transparent;border:1px solid transparent;border-radius:3px;width:26px;height:26px;color:var(--muted);font-size:12px}
.mini:hover{border-color:var(--rule-strong);color:var(--ink)}
.setup-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rounds-pick{display:flex;gap:4px}
.rounds-pick button{background:var(--ground);border:1px solid var(--rule);border-radius:3px;width:32px;height:29px;font-weight:600}
.rounds-pick button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* ---------- season & leaderboard ---------- */
.seasonwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.locked-note{
  flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  text-align:center;padding:40px 20px;color:var(--muted);
}
.locked-note h2{font-size:clamp(34px,4vw,54px);text-transform:uppercase;color:var(--ink)}
.locked-note p{max-width:52ch;font-size:17px;line-height:1.5;margin:0}

.recapcard{
  flex:0 0 auto;background:var(--flag);color:var(--flag-ink);border-radius:var(--r);
  padding:11px 22px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.recapcard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 76px)}
.recap-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.recap-week{font-family:'Big Shoulders Display','Archivo',sans-serif;font-weight:800;font-size:40px;line-height:.9;text-transform:uppercase}
.recap-when{font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
.recap-body{position:relative;z-index:1;font-size:clamp(16px,1.25vw,21px);line-height:1.4;margin-top:5px;max-width:118ch;font-weight:500}
.weekpick{display:flex;gap:4px;flex-wrap:wrap;align-items:center;position:relative;z-index:1;margin-top:10px}
.wchip{
  background:rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.2);border-radius:3px;color:inherit;
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:2px 7px;min-width:30px;
}
.wchip[aria-pressed="true"]{background:var(--flag-ink);color:var(--flag);border-color:var(--flag-ink)}
.wchip[disabled]{opacity:.32;cursor:not-allowed}

function lum(hex){
  const h = hex.replace("#","");
  const r=parseInt(h.slice(0,2),16)/255, g=parseInt(h.slice(2,4),16)/255, b=parseInt(h.slice(4,6),16)/255;
  const f = c => c<=.03928 ? c/12.92 : Math.pow((c+.055)/1.055,2.4);
  return .2126*f(r)+.7152*f(g)+.0722*f(b);
}

function weekRecord(owner, wk, rost){

}

  return {w,l,t,str: t?`${w}-${l}-${t}`:`${w}-${l}`, pct: (w+l+t)?(w+t*0.5)/(w+l+t):0};
}

/* ================= LIVE SCORES =================
   Only works where the page is allowed to make requests — i.e. hosted on
   GitHub Pages or opened from disk. Inside the claude.ai artifact sandbox
   every outbound request is blocked, so this fails quietly and the page
   falls back to the season-data block baked into the HTML.

   Endpoint shape confirmed against a real response:
   .../scoreboard?dates=YYYY&seasontype=2&week=N
     -> { week:{number}, events:[ { competitions:[ {
            status:{type:{state,completed}},
            competitors:[ {score:"24", winner:true, team:{abbreviation}} ] } ] } ] }
   Abbreviations match ours for 31 teams; ESPN calls Washington WSH.        */
const ESPN_BASE = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
const FROM_ESPN = {WSH:"WAS"};
const fromEspn = a => FROM_ESPN[a] || a;
let LIVE = {on:false, at:null, inProgress:0, scheduled:0, error:null, games:[], week:0};
/* True only where the page can read its own sibling files — i.e. hosted on
   GitHub Pages. Inside the artifact sandbox every request is refused, and a
   browser-initiated download would be refused too, so the download button
   stays hidden there and Copy is the way out. */
let HOSTED = false;

function nflWeekNow(){
  const start = new Date(SEASON.seasonStart+"T00:00:00-04:00");
  const days = Math.floor((Date.now()-start.getTime())/86400000);
  if(days < 0) return 0;
  return Math.min(SEASON.totalWeeks, Math.floor(days/7)+1);
}
function cacheGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function cacheSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

async function fetchWeek(w){
  const key = `sifi-espn-${SEASON.season}-w${w}`;
  const hit = cacheGet(key);
  if(hit && hit.complete) return hit;                 // finished weeks never change
  const res = await fetch(`${ESPN_BASE}?dates=${SEASON.season}&seasontype=2&week=${w}`, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const j = await res.json();
  const results={}; let done=0, inProgress=0, scheduled=0, last=null;
  const games=[];
  (j.events||[]).forEach(ev=>{
    const c=(ev.competitions||[])[0]; if(!c) return;
    const st=(c.status&&c.status.type)||{};
    const cs=c.competitors||[];
    if(cs.length!==2) return;
    games.push(parseGame(ev,c,st,cs));
    if(st.completed){
      done++;
      if(ev.date && (!last || ev.date>last)) last=ev.date;
      const [a,b]=cs;
      const ia=fromEspn(a.team&&a.team.abbreviation), ib=fromEspn(b.team&&b.team.abbreviation);
      const sa=Number(a.score), sb=Number(b.score);
      if(Number.isFinite(sa) && Number.isFinite(sb) && sa!==sb){
        results[sa>sb?ia:ib]="W"; results[sa>sb?ib:ia]="L";
      } else if(Number.isFinite(sa) && sa===sb){
        results[ia]="T"; results[ib]="T";
      } else {                                        // scores missing: trust the winner flag
        if(a.winner===true){ results[ia]="W"; results[ib]="L"; }
        else if(b.winner===true){ results[ib]="W"; results[ia]="L"; }
      }
    }
    else if(st.state==="in") inProgress++;
    else scheduled++;
  });
  const out={n:w, results, done, inProgress, scheduled, games,
             complete: done>0 && inProgress===0 && scheduled===0,
             through: last ? last.slice(0,10) : null};
  // cache finished weeks without the per-game detail — it never gets looked at again
  if(out.complete) cacheSet(key, Object.assign({}, out, {games:[]}));
  return out;
}

/* One game, flattened. Field names verified against a real ESPN response:
   competition.status = {clock, displayClock, period, type:{state,completed,shortDetail,...}}
   Live games were not observable in August, so the clock string falls back
   through shortDetail -> period/displayClock -> a plain label.            */
function parseGame(ev, c, st, cs){
  const home = cs.find(x=>x.homeAway==="home") || cs[0];
  const away = cs.find(x=>x.homeAway==="away") || cs[1];
  const side = x => ({
    espnId: String(x.id || ""),
    id: fromEspn(x.team && x.team.abbreviation),
    name: (x.team && x.team.shortDisplayName) || (x.team && x.team.name) || "",
    score: Number(x.score),
    record: ((x.records||[]).find(r=>r.name==="overall")||{}).summary || ""
  });
  const state = st.state || (st.completed ? "post" : "pre");
  const stat = c.status || {};
  let clock = "";
  if(state === "in"){
    if(st.name === "STATUS_HALFTIME") clock = "Halftime";
    else if(st.shortDetail) clock = st.shortDetail;
    else if(stat.period) clock = "Q" + stat.period + (stat.displayClock ? " · " + stat.displayClock : "");
    else clock = "In progress";
  }
  /* situation only exists while a game is live. Verified against a real
     in-progress game: {possession (a competitor id), shortDownDistanceText,
     possessionText, isRedZone, lastPlay:{text,type}}. */
  const sit = c.situation || null;
  return {
    id: ev.id, date: ev.date, state,
    clock, detail: st.shortDetail || st.detail || "",
    home: side(home), away: side(away),
    tv: ((c.broadcasts||[]).find(b=>b.market==="national") || (c.broadcasts||[])[0] || {names:[]}).names[0] || "",
    ball: sit && sit.possession ? String(sit.possession) : "",
    downDist: sit ? (sit.shortDownDistanceText || "") : "",
    spot: sit ? (sit.possessionText || "") : "",
    redZone: !!(sit && sit.isRedZone),
    lastPlay: sit && sit.lastPlay && sit.lastPlay.text ? String(sit.lastPlay.text).trim() : ""
  };
}

/* teamId -> what that team is doing right now */
function liveMapFrom(games){
  const m = {};
  (games||[]).forEach(g=>{
    if(g.state === "post") return;
    const pair = [[g.home, g.away], [g.away, g.home]];
    pair.forEach(([me, them])=>{
      const leading = g.state==="in" && Number.isFinite(me.score) && Number.isFinite(them.score) && me.score > them.score;
      const tied    = g.state==="in" && me.score === them.score;
      m[me.id] = {state:g.state, leading, tied, me, them, game:g};
    });
  });
  return m;
}

async function loadLiveSeason(){
  const upto = nflWeekNow();
  const weeks=[]; let inProgress=0, scheduled=0, tail=null;

  // Before kickoff week there is nothing played, but week 1's schedule still
  // answers "who's up next", so fetch it anyway.
  if(upto < 1){
    const first = await fetchWeek(1);
    LIVE = Object.assign(LIVE, {on:true, at:new Date(), inProgress:0, scheduled:first.scheduled,
                                error:null, games:(first.games||[]).filter(g=>g.state!=="post"), week:1});
    return false;                                     // no results to show yet
  }

  for(let w=1; w<=upto; w++){
    let got;
    try{ got = await fetchWeek(w); }
    catch(e){ if(w===1) throw e; break; }             // week 1 failing means no access at all
    tail = got;
    if(!got.done && !got.inProgress){                 // week hasn't kicked off yet
      break;
    }
    inProgress+=got.inProgress; scheduled+=got.scheduled;
    if(got.done) weeks.push(got);
  }

  let games = tail ? (tail.games||[]).filter(g=>g.state!=="post") : [];
  let gweek = tail ? tail.n : 0;
  // everything in this week is final — reach forward so "up next" still speaks
  if(!games.length && upto < SEASON.totalWeeks){
    try{
      const nxt = await fetchWeek(upto+1);
      games = (nxt.games||[]).filter(g=>g.state!=="post");
      gweek = upto+1;
    }catch(e){}
  }

  if(!weeks.length){
    LIVE = Object.assign(LIVE, {on:true, at:new Date(), inProgress, scheduled, error:null, games, week:gweek});
    return false;
  }

  const recaps = SEASON.recaps || {};
  SEASON.weeks = weeks.map(w=>({
    n:w.n, through:w.through, results:w.results,
    recap: recaps[String(w.n)] || (SEASON.weeks.find(x=>x.n===w.n)||{}).recap || autoRecap(w)
  }));
  LIVE = {on:true, at:new Date(), inProgress, scheduled, error:null, games, week:gweek};
  return true;
}

/* When nobody has written a line for the week, state the facts rather than
   inventing a story about games this page has not seen. */
function autoRecap(w){
  const rost = liveRosters();
  if(!rost) return `${w.done} games final.`;
  const tally = rost.order.map(nm=>({nm, r:weekRecord(nm,{results:w.results},rost)}))
                          .sort((a,b)=> b.r.w-a.r.w || a.r.l-b.r.l);
  const top=tally[0], bot=tally[tally.length-1];
  const openText = w.inProgress ? ` ${w.inProgress} game${w.inProgress>1?"s":""} still being played.` : "";
  return `${w.done} games final. Best week: ${top.nm} at ${top.r.str}. Worst: ${bot.nm} at ${bot.r.str}.${openText}`;
}

/* Rosters and the hand-written recap lines are separate files when this is
   hosted; inside the artifact those requests are blocked and the embedded
   season-data block is used instead. */
async function loadSideFiles(){
  const grab = async (file)=>{
    try{
      const r = await fetch(file, {cache:"no-store"});
      HOSTED = true;                                   // the request itself was allowed
      if(!r.ok) return null;
      return await r.json();
    }catch(e){ return null; }
  };
  const [ros, rec] = await Promise.all([grab("rosters.json"), grab("recaps.json")]);
  if(ros && ros.order && ros.rosters && ros.order.length){
    SEASON.order = ros.order; SEASON.rosters = ros.rosters;
  }
  if(ros && typeof ros.draftClosed === "boolean") SEASON.draftClosed = ros.draftClosed;
  if(rec && typeof rec === "object") SEASON.recaps = rec;
}

async function bootLive(){
  await loadSideFiles();
  let changed = !!(SEASON.order && SEASON.order.length);
  try{
    if(await loadLiveSeason()) changed = true;
  }catch(e){
    LIVE.error = String(e && e.message || e);         // sandboxed: embedded data stands
  }
  if(changed){
    ui.week=null;
    /* Land on the results once they exist — unless someone is mid-draft or
       has already chosen a tab for themselves. */
    const anyLive = (LIVE.games||[]).some(g=>g.state==="in");
    if(draftLocked()) ui.tab = (SEASON.weeks.length || anyLive) ? "season" : "leader";
    else if(!ui.tabTouched && (SEASON.weeks.length || anyLive) && S.phase!=="draft") ui.tab="season";
    render();
  }
}

function liveBadge(){
  if(!LIVE.on) return "";
  const t = LIVE.at ? LIVE.at.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}) : "";
  const open = LIVE.inProgress ? ` · ${LIVE.inProgress} game${LIVE.inProgress>1?"s":""} in progress` : "";
  return `<span class="livedot">live from ESPN · ${t}${open}</span>`;
}

/* ================= WHO'S PLAYING =================
   Owner-first: the question is "who has a game on right now, and who's next",
   not "what is the score". Scores and the clock ride along when ESPN has them
   and are simply left off when it doesn't — the schedule alone is enough. */
function ownerOf(rost, teamId){
  for(const nm of rost.order){ if((rost.rosters[nm]||[]).includes(teamId)) return nm; }
  return null;
}
function relTime(iso){
  const t = new Date(iso).getTime();
  if(isNaN(t)) return "";
  const mins = Math.round((t - Date.now())/60000);
  if(mins <= 0) return "now";
  if(mins < 60) return `in ${mins} min`;
  const h = Math.floor(mins/60), m = mins % 60;
  if(h < 24) return m ? `in ${h}h ${m}m` : `in ${h}h`;
  return `in ${Math.round(h/24)} day${Math.round(h/24)===1?"":"s"}`;
}
function clockTime(iso){
  const d = new Date(iso);
  if(isNaN(d)) return "";
  return d.toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"});
}

/* One row per game, both brothers named. Every NFL team is owned in this
   league, so a row per owner would print each game twice. */
function gameRows(rost, games, state){
  return games.filter(g=>g.state===state).map(g=>({
    g,
    away: {t:g.away, who: ownerOf(rost, g.away.id)},
    home: {t:g.home, who: ownerOf(rost, g.home.id)}
  })).filter(r=>r.away.who || r.home.who);
}

function nowBand(rost){
  const games = LIVE.games || [];
  if(!games.length) return "";

  const live = gameRows(rost, games, "in");
  const pre  = gameRows(rost, games, "pre").sort((a,b)=> new Date(a.g.date) - new Date(b.g.date));

  // everything still to be played, bucketed by kickoff
  const slots = [];
  pre.forEach(r=>{
    const last = slots[slots.length-1];
    if(last && last.at === r.g.date) last.rows.push(r);
    else slots.push({at:r.g.date, rows:[r]});
  });
  if(!live.length && !slots.length) return "";

  const side = (sd, other, right, liveGame, g) => {
    const t = teamById(sd.t.id);
    const lead = liveGame && Number.isFinite(sd.t.score) && Number.isFinite(other.t.score) && sd.t.score > other.t.score;
    const hasBall = liveGame && g && g.ball && g.ball === sd.t.espnId;
    return `<div class="nowside${right?" r":""}${lead?" lead":""}${sd.who?"":" none"}">
      <div class="nowwho">${esc(sd.who || "unowned")}</div>
      <div class="nowteam">${t?`<i style="background:${t.c1}"></i>`:""}<span>${esc(sd.t.name)}</span>${hasBall?`<span class="ball" title="has the ball"></span>`:""}</div>
    </div>`;
  };

  const liveBox = !live.length ? "" :
    `<div class="nowbox">
       <div class="nowhead">
         <h3><span class="onair"></span>On now</h3>
         <div class="nowwhen">${live.length} game${live.length===1?"":"s"} in progress</div>
         <div class="spacer"></div>
         <div class="liveage" id="liveAge">updating…</div>
       </div>
       <div class="nowlist">
         ${live.map(r=>{
           const sit = (r.g.downDist || r.g.spot || r.g.lastPlay || r.g.redZone) ? `
             <div class="nowsit">
               ${r.g.downDist?`<span class="nowdd">${esc(r.g.downDist)}</span>`:""}
               ${r.g.spot?`<span class="nowspot">at ${esc(r.g.spot)}</span>`:""}
               ${r.g.redZone?`<span class="rz">red zone</span>`:""}
               ${r.g.lastPlay?`<span class="nowplay">${esc(r.g.lastPlay)}</span>`:""}
             </div>` : "";
           return `
           <div class="nowrow">
             ${side(r.away, r.home, false, true, r.g)}
             <div class="nowmid">
               ${Number.isFinite(r.away.t.score)&&Number.isFinite(r.home.t.score)
                  ? `<div class="nowscore">${r.away.t.score} – ${r.home.t.score}</div>` : `<div class="nowscore">vs</div>`}
               ${r.g.clock ? `<div class="nowclock">${esc(r.g.clock)}</div>` : ""}
             </div>
             ${side(r.home, r.away, true, true, r.g)}
             ${sit}
           </div>`;}).join("")}
       </div>
     </div>`;

  const nextBox = !slots.length ? "" :
    `<div class="nowbox next">
       <div class="nowhead">
         <h3>Still to play</h3>
         <div class="nowwhen">${pre.length} game${pre.length===1?"":"s"} · first at ${esc(clockTime(slots[0].at))}, ${esc(relTime(slots[0].at))}</div>
       </div>
       <div class="nowlist">
         ${slots.map((sl,gi)=>`
           <div class="nowgroup${gi===0?" first":""}"><b>${esc(clockTime(sl.at))}</b><span>${esc(relTime(sl.at))}</span></div>
           ${sl.rows.map(r=>`
             <div class="nowrow">
               ${side(r.away, r.home, false, false, r.g)}
               <div class="nowmid">
                 <div class="nowkick">${r.g.tv?esc(r.g.tv):"at"}</div>
               </div>
               ${side(r.home, r.away, true, false, r.g)}
             </div>`).join("")}
         `).join("")}
       </div>
     </div>`;

  return `<div class="nowband${(liveBox&&nextBox)?"":" solo"}">${liveBox}${nextBox}</div>`;
}

/* Poll while something is live, or as a kickoff approaches. Nothing running
   means no polling at all. */
let nowTimer = null;
function scheduleLiveRefresh(){
  clearTimeout(nowTimer);
  const games = LIVE.games || [];
  if(!games.length || !LIVE.on) return;
  const anyLive = games.some(g=>g.state==="in");
  const soon = games.some(g=>{
    const d = new Date(g.date).getTime();
    return g.state==="pre" && d - Date.now() < 30*60000;
  });
  if(!anyLive && !soon) return;
  nowTimer = setTimeout(async ()=>{
    try{
      if(await loadLiveSeason()){
        if(ui.tab==="season") renderSeason();
        else if(ui.tab==="leader") renderLeader();
      }
    }catch(e){}
    scheduleLiveRefresh();
  }, anyLive ? 30000 : 60000);
}

/* Shows the age of the data so it is obvious the page is refreshing itself.
   Called on render as well as on the tick, so it never flashes a placeholder. */
function tickLiveAge(){
  const el = document.getElementById("liveAge");
  if(!el || !LIVE.at) return;
  const s = Math.max(0, Math.round((Date.now() - LIVE.at.getTime())/1000));
  el.textContent = s < 5 ? "just updated" : s < 90 ? `updated ${s}s ago` : `updated ${Math.round(s/60)}m ago`;
}
setInterval(tickLiveAge, 1000);

/* ================= SEASON VIEW ================= */
function renderSeason(){
  const host=document.getElementById("seasonBody");
  const rost=liveRosters();
  if(!rost || !SEASON.weeks.length){
    const anyLive = (LIVE.games||[]).some(g=>g.state==="in");
    const kicked  = (LIVE.games||[]).length && new Date(SEASON.seasonStart+"T00:00:00-04:00") <= new Date();
    host.innerHTML = (rost ? nowBand(rost) : "") + lockedPanel(
      !rost ? "Nothing to track yet" : anyLive ? "Week 1 is under way" : "No results yet",
      !rost
        ? "The season view switches on once all 32 picks are in. Finish the draft on the Draft tab and this fills itself in from there."
        : anyLive
          ? "Records fill in above as games go final — nobody has to type anything in. The Leaderboard tab has everyone's four teams."
          : kicked
            ? "Nothing has gone final yet. Records fill in here as games finish, on their own."
            : `Rosters are locked in. The season opens ${fmtDate(SEASON.seasonStart)}, and results land here on their own as games finish. The Leaderboard tab has everyone's four teams in the meantime.`
    );
    scheduleLiveRefresh();
    tickLiveAge();
    return;
  }
  if(ui.week==null || !weekByNumber(ui.week)) ui.week = latestWeek();
  const wk = weekByNumber(ui.week);
  const rows = rost.order.map(nm=>({nm, wr:weekRecord(nm,wk,rost), tr:totalRecord(nm,rost,wk.n)}))
                         .sort((a,b)=> b.wr.w-a.wr.w || a.wr.l-b.wr.l);

  let chips = "";
  for(let i=1;i<=SEASON.totalWeeks;i++){
    const have=!!weekByNumber(i);
    chips += `<button class="wchip" data-week="${i}" aria-pressed="${i===ui.week}"${have?"":" disabled"}>${i}</button>`;
  }

  host.innerHTML =
    `<div class="recapcard">
       <div class="recap-head">
         <div class="recap-week">Week ${wk.n}</div>
         <div class="recap-when">${wk.through?"through "+fmtDate(wk.through):"&nbsp;"}</div>
       </div>
       <div class="recap-body">${esc(wk.recap||"No notes this week.")}</div>
       <div class="weekpick">${chips}</div>
     </div>
     ${wk.n === LIVE.week || (LIVE.week && ui.week === latestWeek()) ? nowBand(rost) : ""}
     <div class="seasonmain">
       <section class="panel">
         <div class="phead"><h2>Week ${wk.n}</h2><span class="note">best to worst</span><div class="spacer"></div>${liveBadge()}</div>
         <div class="wkrows">
           ${rows.map((r,i)=>`
             <div class="wkrow ${r.wr.w>r.wr.l?"win":r.wr.w<r.wr.l?"loss":""}">
               <div class="wkrank">${i+1}</div>
               <div>
                 <div class="wkname">${esc(r.nm)}</div>
                 <div class="wkteams">${(rost.rosters[r.nm]||[]).map(id=>teamMark(id,wk)).join(" · ")}</div>
               </div>
               <div class="wkrec">${r.wr.str}<small>${r.tr.str} overall</small></div>
             </div>`).join("")}
         </div>
       </section>
       <section class="panel">
         <div class="phead"><h2>The Season</h2><span class="note">${SEASON.weeks.length} of ${SEASON.totalWeeks} weeks in</span></div>
         <div class="gridscroll">${seasonTable(rost)}</div>
       </section>
     </div>`;

  host.querySelectorAll(".wchip").forEach(c=>{
    if(c.disabled) return;
    c.onclick=()=>{ ui.week=+c.dataset.week; renderSeason(); };
  });
  scheduleFit();
  scheduleLiveRefresh();
  tickLiveAge();
}

function teamMark(id, wk){
  const t=teamById(id); if(!t) return "";
  const r = wk && wk.results ? wk.results[id] : null;
  let mark = r==="W" ? "✓" : r==="L" ? "✕" : r==="T" ? "=" : "–";
  // playing right now, in the week being shown
  if(!r && wk && wk.n === LIVE.week && (LIVE.games||[]).some(g=>g.state==="in" && (g.home.id===id || g.away.id===id))){
    mark = "●";
  }
  return `${esc(t.name)} ${mark}`;
}
function seasonTable(rost){
  const weeks = SEASON.weeks.map(w=>w.n);
  let h = `<table class="wktable"><thead><tr><th class="who">Owner</th>`;
  weeks.forEach(w=>{ h+=`<th>W${w}</th>`; });
  h += `<th>Total</th></tr></thead><tbody>`;
  standings(rost).forEach(s=>{
    h += `<tr><td class="who">${esc(s.nm)}</td>`;
    weeks.forEach(w=>{
      const wk=weekByNumber(w), r=weekRecord(s.nm,wk,rost);
      const cls = !r.played ? "none" : r.w>r.l ? "w" : r.w<r.l ? "l" : "";
      h += `<td class="wkcell ${cls}">${r.played?r.str:"—"}</td>`;
    });
    h += `<td class="tot">${s.r.str}</td></tr>`;
  });
  return h + `</tbody></table>`;
}

/* ================= LEADERBOARD ================= */
function renderLeader(){
  const host=document.getElementById("leaderBody");
  const rost=liveRosters();
  if(!rost){
    host.innerHTML = lockedPanel("Leaderboard locked",
      "It opens the moment the draft is done — 32 picks, everybody with four teams. Until then there is nothing to be smug about.");
    return;
  }
  const played = SEASON.weeks.length;
  /* Nobody leads before kickoff — with everyone at 0-0 a "ranking" is just
     alphabetical order wearing a gold border. Show draft order instead. */
  const table = played ? standings(rost)
                       : rost.order.map(nm=>({nm, r:totalRecord(nm,rost)}));
  const lastIdx = table.length-1;
  /* Money stays off the board until the season is actually over. */
  const final = played >= SEASON.totalWeeks;
  const left = Math.max(0, SEASON.totalWeeks - played);

  let blurb;
  if(!played) blurb = "No games played yet. Everyone is undefeated and everyone is a genius.";
  else if(final) blurb = `Final. ${table[0].nm} takes ${MONEY[1]}, ${table[1].nm} takes ${MONEY[2]}, and ${table[lastIdx].nm} gets ${MONEY_LAST} back for finishing last at ${table[lastIdx].r.str}.`;
  else blurb = `${table[0].nm} is on top at ${table[0].r.str}, ${table[lastIdx].nm} is holding up the bottom at ${table[lastIdx].r.str}, and there ${left===1?"is 1 week":"are "+left+" weeks"} left to do something about it.`;

  host.innerHTML =
    `<div class="recapcard">
       <div class="recap-head">
         <div class="recap-week">${played?(final?"Final standings":`Through week ${latestWeek()}`):"Rosters set"}</div>
         <div class="recap-when">${played?`${table[0].nm} leads at ${table[0].r.str}`:"Season opens "+fmtDate(SEASON.seasonStart)}</div>
       </div>
       <div class="recap-body">${esc(blurb)}</div>
     </div>
     ${nowBand(rost)}
     <section class="panel" style="flex:1 1 auto;min-height:0">
       <div class="phead"><h2>${played?"Leaderboard":"The Rosters"}</h2><span class="note">${played?played+" of "+SEASON.totalWeeks+" weeks played":"in draft order · nobody leads yet"}</span><div class="spacer"></div>${liveBadge()}</div>
       <div class="ladder${final?"":" no-money"}">
         ${table.map((s,i)=>`
           <div class="lrow ${played&&i===0?"p1":played&&i===1?"p2":""} ${i===lastIdx&&played?"plast":""}">
             <div class="lrank">${i+1}</div>
             <div>
               <div class="lname">${esc(s.nm)}</div>
               <div class="lteams">${(rost.rosters[s.nm]||[]).map(id=>{
                 const t=teamById(id); if(!t) return "";
                 return `<span class="lteam"><i style="background:${t.c1}"></i>${esc(t.name)}${played?" "+teamRecord(id):""}</span>`;
               }).join("")}</div>
             </div>
             <div class="lrec">${played?s.r.str:"—"}<small>${played?(s.r.pct*100).toFixed(0)+"%":"pick "+(i+1)}</small></div>
             ${final?`<div class="lmoney">${i===0?MONEY[1]:i===1?MONEY[2]:i===lastIdx?MONEY_LAST:"—"}</div>`:""}
           </div>`).join("")}
       </div>
     </section>`;
  scheduleFit();
  scheduleLiveRefresh();
  tickLiveAge();
}

function lockedPanel(title, body){
  return `<section class="panel" style="flex:1 1 auto;min-height:0">
    <div class="locked-note"><h2>${esc(title)}</h2><p>${esc(body)}</p></div>
  </section>`;
}
function fmtDate(iso){
  if(!iso) return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("en-US",{month:"long",day:"numeric"});
}

/* ================= SETUP ================= */
function renderSetup(){
  const list = document.getElementById("slotList");
  list.innerHTML = S.players.map((nm,i)=>
    `<div class="slot" data-i="${i}">
      <div class="slot-no">${i+1}</div>
      <input value="${esc(nm)}" placeholder="Name" data-i="${i}" aria-label="Slot ${i+1}">
      <div style="display:flex;gap:2px">
        <button class="mini" data-up="${i}" aria-label="Move up">▲</button>
        <button class="mini" data-down="${i}" aria-label="Move down">▼</button>
        <button class="mini" data-del="${i}" aria-label="Remove">✕</button>
      </div>
    </div>`).join("");

  document.getElementById("playerCount").textContent =
    `${n()} in · ${n()*S.rounds} picks · ${32-n()*S.rounds} teams left on the table at the end`;

  const maxR = Math.max(1, Math.min(6, Math.floor(32/Math.max(1,n()))));
  if(S.rounds > maxR) S.rounds = maxR;
  const rp = document.getElementById("roundsPick");
  rp.innerHTML = "";
  for(let r=1;r<=maxR;r++){
    const b=document.createElement("button");
    b.textContent=r; b.setAttribute("aria-pressed",String(r===S.rounds));
    b.onclick=()=>{S.rounds=r;save();renderSetup();};
    rp.appendChild(b);
  }
  document.getElementById("roundsNote").textContent =
    (n()===8 && S.rounds===4) ? "Eight brothers, four rounds — every NFL team gets taken. Same as always."
                              : `${n()} × ${S.rounds} = ${n()*S.rounds} of 32 teams.`;

  const seen=new Set(); let dupe=false;
  S.players.forEach(p=>{const k=p.trim().toLowerCase(); if(k&&seen.has(k))dupe=true; seen.add(k);});
  const blank = S.players.some(p=>!p.trim());
  document.getElementById("setupWarn").textContent =
    blank ? "Every slot needs a name before you can start."
    : dupe ? "Two people have the same name — the board will get confusing."
    : "";
  document.getElementById("startBtn").disabled = blank || n()<2;
}
document.getElementById("slotList").addEventListener("input", e=>{
  const i = e.target.dataset.i;
  if(i!==undefined && e.target.tagName==="INPUT"){
    S.players[+i]=e.target.value; save();
    document.getElementById("startBtn").disabled = S.players.some(p=>!p.trim()) || n()<2;
  }
});
document.getElementById("slotList").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.up!==undefined){const i=+b.dataset.up; if(i>0)[S.players[i-1],S.players[i]]=[S.players[i],S.players[i-1]];}
  else if(b.dataset.down!==undefined){const i=+b.dataset.down; if(i<n()-1)[S.players[i+1],S.players[i]]=[S.players[i],S.players[i+1]];}
  else if(b.dataset.del!==undefined){ if(n()>2) S.players.splice(+b.dataset.del,1); }
  save(); renderSetup();
});
document.getElementById("addPlayer").onclick=()=>{S.players.push("");save();renderSetup();};
document.getElementById("resetNames").onclick=()=>{S.players=[...DEFAULT_NAMES];S.rounds=4;save();renderSetup();};

document.getElementById("shuffleBtn").onclick=function(){
  const btn=this, target=S.players.slice();
  for(let i=target.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[target[i],target[j]]=[target[j],target[i]];}
  if(reduced()){ S.players=target; save(); renderSetup(); toast("Order drawn"); return; }
  btn.disabled=true;
  const inputs=()=>Array.from(document.querySelectorAll("#slotList input"));
  let settled=0;
  const spin=setInterval(()=>{ inputs().forEach((inp,i)=>{ if(i>=settled) inp.value = target[Math.floor(Math.random()*target.length)]; }); },55);
  const next=()=>{
    const list=inputs();
    if(settled>=list.length){
      clearInterval(spin); S.players=target; save(); renderSetup();
      btn.disabled=false; toast(`${target[0]} is on the clock first`); return;
    }
    list[settled].value=target[settled];
    list[settled].closest(".slot").classList.add("settled");
    settled++; setTimeout(next,320);
  };
  setTimeout(next,650);
};
document.getElementById("startBtn").onclick=()=>{
  S.players=S.players.map(p=>p.trim());
  S.phase="draft"; S.startedAt=Date.now(); S.lastPickAt=Date.now();
  save(); render(); focusSearch();
};

/* ================= CLOCK ================= */
let lastClockKey = "";
function renderClock(){
  const el=document.getElementById("clockStrip");
  const done=isDone();
  el.className="clock"+(done?" done":"");
  if(done){
    const rank=S.players.map((nm,i)=>({nm,p:paperFor(i)})).sort((a,b)=>b.p.w-a.p.w||a.p.l-b.p.l);
    const top=rank[0], bot=rank[rank.length-1];
    el.innerHTML=
      `<div><div class="clock-label">Draft complete</div>
        <div class="clock-name">That's a wrap</div></div>
       <div class="spacer"></div>
       <div class="clock-right">
         <div class="clock-label">Best on 2025 paper</div>
         <div class="clock-big">${esc(top.nm)} ${top.p.str}</div>
         <div class="clock-meta">Worst: ${esc(bot.nm)} ${bot.p.str}. Which, as Greg's 51-17 proved, means everything or nothing.</div>
       </div>`;
    lastClockKey="done";
  }else{
    const k=S.picks.length, s=slotForPick(k), who=S.players[s.player], ly=lastYearFor(who);
    const prev=k>0?teamById(S.picks[k-1].team):null;
    const prevWho=k>0?S.players[slotForPick(k-1).player]:null;
    const key=who+"|"+k;
    const roll = key!==lastClockKey && !reduced() ? " nameroll" : "";
    lastClockKey=key;
    el.innerHTML=
      `<div style="min-width:260px">
         <div class="clock-label">On the clock</div>
         <div class="clock-name${roll}">${esc(who)}</div>
       </div>
       <div class="spacer"></div>
       <div class="clock-right">
         <div class="clock-label">Just taken</div>
         <div class="clock-big">${prev
            ? `<span class="lastchip" style="background:${prev.c1}"></span>${esc(prevWho)} → ${esc(prev.name)}`
            : "First pick of the night"}</div>
       </div>
       <div class="clock-right" style="min-width:150px">
         <div class="clock-label">Round ${s.round+1} · pick ${s.order+1}</div>
         <div class="clock-count">${k+1}<span style="opacity:.55;font-size:28px"> / ${totalPicks()}</span></div>
         <div class="clock-meta" style="font-size:14px;opacity:.7">${s.round%2===0?"running 1 → "+n():"running "+n()+" → 1"} · <span class="mono" id="tick">0:00</span></div>
       </div>`;
  }
}

function renderTopActions(){

  if(ui.tab!=="draft"){ acts.innerHTML=""; return; }
  if(S.phase==="setup"){
    acts.innerHTML = S.picks.length ? `<button class="btn primary" id="resumeBtn">Back to the board (${S.picks.length} in)</button>` : "";

  }
  acts.innerHTML=

     <button class="btn" id="undoBtn"${S.picks.length?"":" disabled"}>↺ Undo</button>
     <button class="btn" id="exportBtn">Results</button>
     <button class="btn ghost" id="backBtn">Edit order</button>
     <button class="btn ghost" id="resetBtn">Reset</button>`;
  document.getElementById("annBtn").onclick=function(){
    S.announce=!S.announce; this.setAttribute("aria-pressed",String(S.announce)); save();
    toast(S.announce?"Big reveal on":"Big reveal off — fast mode");
  };
  document.getElementById("undoBtn").onclick=()=>{
    if(!S.picks.length) return;
    const p=S.picks.pop(); S.lastPickAt=Date.now(); ui.freshPick=-1; save(); render();
    toast(`Undone — ${teamById(p.team).name} back in the pool`);
  };
  document.getElementById("exportBtn").onclick=openExport;
  document.getElementById("backBtn").onclick=()=>{S.phase="setup";save();render();};
  const rb=document.getElementById("resetBtn");
  rb.onclick=()=>{
    if(rb.dataset.armed){
      S={phase:"setup",players:[...DEFAULT_NAMES],rounds:4,picks:[],startedAt:null,lastPickAt:null,announce:S.announce};
      ui.freshPick=-1; save(); render(); toast("Board cleared");
    }else{
      rb.dataset.armed="1"; rb.textContent="Really reset?";
      setTimeout(()=>{ if(rb.isConnected){delete rb.dataset.armed; rb.textContent="Reset";} },4000);
    }
  };
}

/* ================= BOARD ================= */
function renderBoard(){
  const g=document.getElementById("bgrid");
  g.style.gridTemplateColumns = `minmax(196px,1fr) repeat(${S.rounds},minmax(0,1fr))`;
  g.style.gridTemplateRows = `auto repeat(${n()},minmax(0,1fr))`;

  const nextIdx=S.picks.length;
  const papers=S.players.map((_,i)=>paperFor(i));
  const bestW=Math.max(0,...papers.filter(p=>p.count>0).map(p=>p.w));

  let html = `<div class="bhead"><div>Order</div>`;
  for(let r=0;r<S.rounds;r++){
    html += `<div>Round ${r+1}<span class="dir">${r%2===0?"1 → "+n():n()+" → 1"}</span></div>`;
  }
  html += `</div>`;

  html += S.players.map((nm,pi)=>{
    const ly=lastYearFor(nm), pa=papers[pi];
    const live = !isDone() && slotForPick(nextIdx).player===pi;
    let cells="";
    for(let r=0;r<S.rounds;r++){
      const k=pickIndexFor(pi,r), p=S.picks[k];
      if(p){
        const t=teamById(p.team);
        cells+=`<div class="cell"><div class="pick${k===ui.freshPick?" fresh":""}" title="${esc(t.city+" "+t.name)} · ${recStr(t)} in 2025 · ${esc(t.post)}">
          <span class="sw" style="background:${t.c1}"><i style="background:${t.c2}"></i></span>
          <span class="pnum">${k+1}</span>
          <div class="tname">${esc(t.name)}</div>
          <div class="trec">${recStr(t)}</div>
        </div></div>`;
      }else{
        cells+=`<div class="cell empty${k===nextIdx?" next":""}"><span class="pno">${k===nextIdx?"ON THE CLOCK":"pick "+(k+1)}</span></div>`;
      }
    }
    return `<div class="orow">
      <div class="owner${live?" live":""}">
        <div><span class="oseed">${pi+1}</span><span class="oname">${esc(nm)}</span></div>
        <div class="osub"${ly?` title="${esc(ly.sub)} 2025 roster: ${esc(ly.teams.join(", "))}"`:""}>${ly?`2025: ${esc(ly.rec)}${esc(ly.fin||"")}`:"First year"}</div>
        ${pa.count?`<div class="paper${(pa.w===bestW&&bestW>0)?" lead":""}" title="Combined 2025 record of the teams drafted so far">${pa.str} on paper</div>`:""}
      </div>${cells}</div>`;
  }).join("");

  g.innerHTML=html;
  document.getElementById("boardProgress").textContent = `${S.picks.length} of ${totalPicks()} picks in`;
  scheduleFit();
}

/* ================= POOL ================= */
function buildTiles(){
  const pool=document.getElementById("pool");
  pool.innerHTML="";
  tiles.clear();
  TEAMS.forEach(t=>{
    const b=document.createElement("button");
    b.className="tile"; b.dataset.team=t.id;
    b.style.background=`linear-gradient(155deg, ${t.c1} 0%, ${shade(t.c1,-14)} 100%)`;
    b.style.color=t.ink;
    b.title = `${t.city} ${t.name} · ${t.conf} ${t.div} · ${recStr(t)} in 2025 · ${t.post}`;
    b.innerHTML=
      `<span class="wedge" style="background:${t.c2}"></span>
       <span class="abbr">${t.id}</span>
       <span class="tn">${esc(t.name)}</span>
       <span class="foot"><span class="rec mono">${recStr(t)}</span><span class="post">${shortPost(t)}</span></span>
       <span class="jab">${esc(t.jab)}</span>
       <span class="stamp"></span>
       <span class="owned hide"></span>`;
    pool.appendChild(b);
    tiles.set(t.id,b);
  });
  const empty=document.createElement("div");
  empty.className="pool-empty hide"; empty.id="poolEmpty";
  pool.appendChild(empty);
}
function shade(hex,amt){
  const h=hex.replace("#","");
  const p=i=>Math.max(0,Math.min(255,parseInt(h.slice(i,i+2),16)+amt));
  return "#"+[p(0),p(2),p(4)].map(v=>v.toString(16).padStart(2,"0")).join("");
}

function poolOrder(){
  let list=TEAMS.slice();
  if(ui.sort==="record") list.sort((a,b)=>(b.w-b.l)-(a.w-a.l)||b.w-a.w||a.name.localeCompare(b.name));
  else if(ui.sort==="alpha") list.sort((a,b)=>(a.city+a.name).localeCompare(b.city+b.name));
  else list.sort((a,b)=>a.conf.localeCompare(b.conf)||a.div.localeCompare(b.div)||(b.w-b.l)-(a.w-a.l));
  return list;
}
function matches(t){
  const q=ui.query.trim().toLowerCase();
  if(!q) return true;
  return (t.city+" "+t.name+" "+t.id+" "+t.conf+" "+t.div).toLowerCase().includes(q);
}
function availableList(){
  const taken=takenIds();
  return poolOrder().filter(t=>!taken.has(t.id) && matches(t));
}

function renderPool(opts){
  opts=opts||{};
  const taken=takenIds();
  const order=poolOrder();

  // FLIP: capture positions of currently visible tiles
  const before=new Map();
  if(!reduced() && !opts.noFlip){
    tiles.forEach((el,id)=>{ if(el.offsetParent) before.set(id, el.getBoundingClientRect()); });
  }

  const avail=availableList();
  order.forEach((t,i)=>{
    const el=tiles.get(t.id);
    const isTaken=taken.has(t.id);
    const claiming = ui.claiming===t.id;
    const show = claiming || (isTaken ? ui.showTaken : matches(t));
    el.style.order=i;
    el.classList.toggle("gone", !show);
    el.classList.toggle("taken-shown", isTaken && !claiming);
    el.disabled = isTaken || isDone();
    const hitId = avail.length && ui.query ? avail[Math.min(ui.selIndex,avail.length-1)].id : null;
    el.classList.toggle("hit", t.id===hitId);
    const owned=el.querySelector(".owned");
    if(isTaken && !claiming){
      const o=ownerOfTeam(t.id);
      owned.textContent = o ? `${o.name} · pick ${o.pick}` : "";
      owned.classList.remove("hide");
    }else{ owned.classList.add("hide"); }
  });

  const emptyEl=document.getElementById("poolEmpty");
  const anyVisible = order.some(t=>!tiles.get(t.id).classList.contains("gone"));
  emptyEl.classList.toggle("hide", anyVisible);
  emptyEl.textContent = ui.query ? `Nothing matches “${ui.query}”.`
                      : taken.size>=32 ? "Every team is off the board. Turn on “Show drafted” to see where they all went."
                      : "Nothing available.";

  // FLIP: play (Web Animations — leaves no inline transform behind)
  if(before.size && typeof Element.prototype.animate === "function"){
    tiles.forEach((el,id)=>{
      const b=before.get(id); if(!b || !el.offsetParent) return;
      const a=el.getBoundingClientRect();
      const dx=b.left-a.left, dy=b.top-a.top;
      if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
      el.getAnimations().forEach(an=>{ if(an.id==="flip") an.cancel(); });
      const an=el.animate(
        [{transform:`translate(${dx}px, ${dy}px)`},{transform:"translate(0,0)"}],
        {duration:360, easing:"cubic-bezier(.2,.85,.3,1)"}
      );
      an.id="flip";
    });
  }

  document.getElementById("availCount").textContent = `${32-taken.size} of 32 still on the board`;
  scheduleFit();
}

/* ================= DRAFTING ================= */
function draftTeam(id){
  if(isDone() || takenIds().has(id)) return;
  const t=teamById(id);
  const k=S.picks.length;
  const s=slotForPick(k);
  const who=S.players[s.player];
  const nextS = (k+1<totalPicks()) ? slotForPick(k+1) : null;
  const turns = nextS && nextS.round!==s.round;

  S.picks.push({team:id,at:Date.now()});
  S.lastPickAt=Date.now();
  ui.freshPick=k; ui.query=""; ui.selIndex=0;
  const si=document.getElementById("search"); if(si) si.value="";
  save();

  // claim animation on the tile, then reflow it out
  const tile=tiles.get(id);
  if(tile && !reduced()){
    tile.querySelector(".stamp").textContent=who;
    ui.claiming=id;
    tile.classList.add("claiming");
    setTimeout(()=>{
      tile.classList.remove("claiming");
      tile.querySelector(".stamp").textContent="";
      ui.claiming=null;
      renderPool();
    },930);
  }

  renderClock(); renderTopActions(); renderTabs(); renderBoard(); renderPool({noFlip:!!ui.claiming});

  if(S.announce && !reduced()) showAnnouncement(t,who,k,turns,nextS);
  else toast(`${who} takes the ${t.name}`);

  if(isDone()){ celebrate(); setTimeout(openExport, S.announce&&!reduced()?2600:900); }
  else focusSearch();
}

function showAnnouncement(t,who,k,turns,nextS){
  closeAnnouncement(true);
  const d=document.createElement("div");
  d.className="announce"; d.id="announce";
  d.innerHTML=
    `<div class="anncard" style="background:linear-gradient(150deg,${t.c1} 0%,${shade(t.c1,-22)} 100%);color:${t.ink}">
       <span class="wedge2" style="background:${t.c2}"></span>
       <div class="ann-owner">Pick ${k+1} · Round ${slotForPick(k).round+1} · ${esc(who)} selects</div>
       <div class="ann-city">${esc(t.city)}</div>
       <div class="ann-team">${esc(t.name)}</div>
       <div class="ann-meta">${recStr(t)} in 2025 · ${esc(t.post)}</div>
       <div class="ann-jab">${esc(t.jab)}</div>
       ${turns?`<div class="ann-round">Round ${nextS.round+1} — the order reverses</div>`:""}
       <div class="ann-hint">click or type to continue</div>
     </div>`;
  document.body.appendChild(d);
  annOpenedAt = performance.now();
  d.addEventListener("click",()=>closeAnnouncement());
  clearTimeout(annTimer);
  annTimer=setTimeout(()=>closeAnnouncement(), turns?2600:2000);
}
function closeAnnouncement(instant){
  clearTimeout(annTimer);
  const d=document.getElementById("announce"); if(!d) return;
  if(instant){ d.remove(); return; }
  d.classList.add("out");
  setTimeout(()=>{ if(d.isConnected) d.remove(); focusSearch(); },260);
}
function focusSearch(){
  setTimeout(()=>{ const s=document.getElementById("search"); if(s && ui.tab==="draft" && S.phase==="draft" && !isDone()) s.focus(); },40);
}

/* confetti finale */
function celebrate(){
  if(reduced()) return;
  const c=document.createElement("canvas"); c.id="confetti";
  document.body.appendChild(c);
  const ctx=c.getContext("2d");
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const resize=()=>{ c.width=innerWidth*dpr; c.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  resize();
  const cols=TEAMS.map(t=>t.c1).concat(["#E0A800","#FFFFFF"]);
  const bits=Array.from({length:170},()=>({
    x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.7,
    w:5+Math.random()*7, h:8+Math.random()*10,
    vy:1.8+Math.random()*3.2, vx:-1.2+Math.random()*2.4,
    rot:Math.random()*Math.PI, vr:-.12+Math.random()*.24,
    col:cols[Math.floor(Math.random()*cols.length)]
  }));
  const t0=performance.now();
  (function frame(now){
    const el=now-t0;
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ctx.globalAlpha = el>3400 ? Math.max(0,1-(el-3400)/900) : 1;
    bits.forEach(b=>{
      b.x+=b.vx; b.y+=b.vy; b.rot+=b.vr;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
      ctx.fillStyle=b.col; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore();
    });
    if(el<4300) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

/* ================= POOL EVENTS ================= */
document.getElementById("pool").addEventListener("click", e=>{
  const b=e.target.closest(".tile"); if(!b || b.disabled) return;
  draftTeam(b.dataset.team);
});
const searchEl=document.getElementById("search");
searchEl.addEventListener("input", e=>{ ui.query=e.target.value; ui.selIndex=0; renderPool(); });
searchEl.addEventListener("keydown", e=>{
  const list=availableList();
  if(e.key==="Enter"){ e.preventDefault(); const t=list[Math.min(ui.selIndex,list.length-1)]; if(t) draftTeam(t.id); }
  else if(e.key==="ArrowRight"||e.key==="ArrowDown"){ e.preventDefault(); ui.selIndex=Math.min(list.length-1,ui.selIndex+1); renderPool({noFlip:true}); }
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){ e.preventDefault(); ui.selIndex=Math.max(0,ui.selIndex-1); renderPool({noFlip:true}); }
  else if(e.key==="Escape"){ ui.query=""; e.target.value=""; renderPool(); }
});
document.getElementById("clearSearch").onclick=()=>{ ui.query=""; searchEl.value=""; searchEl.focus(); renderPool(); };
document.querySelectorAll('.sortbar .chip[data-sort]').forEach(c=>{
  c.onclick=()=>{
    ui.sort=c.dataset.sort;
    document.querySelectorAll('.sortbar .chip[data-sort]').forEach(x=>x.setAttribute("aria-pressed",String(x===c)));
    renderPool();
  };
});
document.getElementById("showTaken").onclick=function(){
  ui.showTaken=!ui.showTaken; this.setAttribute("aria-pressed",String(ui.showTaken)); renderPool();
};
document.addEventListener("keydown", e=>{
  if(performance.now() - annOpenedAt < 350) return;   // don't let the keypress that made the pick dismiss its own reveal
  const d=document.getElementById("announce");
  if(d && !e.metaKey && !e.ctrlKey && !e.altKey){
    clearTimeout(annTimer);
    d.remove();                       // synchronous, so this keystroke lands in the search box
    if(S.phase==="draft" && !isDone()) searchEl.focus();
  }
});

/* ================= EXPORT ================= */
function buildExport(fmt){
  const rows=S.players.map(nm=>({nm,teams:[]}));
  S.players.forEach((nm,pi)=>{
    for(let r=0;r<S.rounds;r++){ const p=S.picks[pickIndexFor(pi,r)]; rows[pi].teams.push(p?teamById(p.team).name:""); }
  });
  if(fmt==="sheet") return rows.map(r=>[r.nm,"",...r.teams].join("\t")).join("\n");
  if(fmt==="csv"){
    const head=["Owner","W-L",...Array.from({length:S.rounds},(_,i)=>"Team "+(i+1))];
    return [head.join(","),...rows.map(r=>[r.nm,"",...r.teams].map(v=>`"${v}"`).join(","))].join("\n");
  }
  if(fmt==="rosters"){
    const rosters={};
    S.players.forEach((nm,pi)=>{
      rosters[nm]=[];
      for(let r=0;r<S.rounds;r++){ const p=S.picks[pickIndexFor(pi,r)]; if(p) rosters[nm].push(p.team); }
    });
    return JSON.stringify({draftClosed:true, order:S.players.slice(), rosters}, null, 2);
  }
  return S.picks.map((p,k)=>{
    const s=slotForPick(k), t=teamById(p.team);
    return `${String(k+1).padStart(2," ")}. R${s.round+1}  ${S.players[s.player].padEnd(8," ")}  ${t.city} ${t.name} (${recStr(t)} in 2025)`;
  }).join("\n") || "No picks yet.";
}
function openExport(){
  document.getElementById("exportSheet").classList.remove("hide");
  document.getElementById("exportText").value=buildExport(ui.exportFmt);
  document.getElementById("exportNote").textContent =
    ui.exportFmt==="sheet" ? "Columns line up with the Teams block in the spreadsheet."
    : ui.exportFmt==="rosters" ? (HOSTED ? "Save this as rosters.json in the website repo to switch the season on."
                                          : "Copy this into rosters.json in the website repo to switch the season on.")
    : "";
  document.getElementById("dlExport").classList.toggle("hide", ui.exportFmt!=="rosters" || !HOSTED);
}
document.getElementById("closeSheet").onclick=()=>document.getElementById("exportSheet").classList.add("hide");
document.getElementById("exportSheet").addEventListener("click", e=>{ if(e.target.id==="exportSheet") e.currentTarget.classList.add("hide"); });
document.querySelectorAll('.chip[data-fmt]').forEach(c=>{
  c.onclick=()=>{
    ui.exportFmt=c.dataset.fmt;
    document.querySelectorAll('.chip[data-fmt]').forEach(x=>x.setAttribute("aria-pressed",String(x===c)));
    openExport();
  };
});
document.getElementById("dlExport").onclick=()=>{
  try{
    const blob=new Blob([buildExport("rosters")],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="rosters.json";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },0);
  }catch(e){ toast("Download blocked here — use Copy instead"); }
};
document.getElementById("copyExport").onclick=()=>{
  const ta=document.getElementById("exportText"); ta.select();
  const ok=()=>toast("Copied");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(ok,()=>{ try{document.execCommand("copy");ok();}catch(e){} });
  }else{ try{document.execCommand("copy");ok();}catch(e){} }
};

/* ================= MISC ================= */
let toastTimer=null;
function toast(msg){
  let el=document.querySelector(".toast");
  if(!el){ el=document.createElement("div"); el.className="toast"; document.body.appendChild(el); }
  el.textContent=msg;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.remove(),2200);
}
setInterval(()=>{
  const el=document.getElementById("tick");
  if(!el || !S.lastPickAt) return;
  const s=Math.max(0,Math.floor((Date.now()-S.lastPickAt)/1000));
  el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
},500);

function renderTabs(){
  const ready = seasonReady();
  const hideDraft = draftLocked();
  document.querySelectorAll("#tabs .tab").forEach(b=>{
    if(b.dataset.tab==="draft") b.classList.toggle("hide", hideDraft);
    const locked = (b.dataset.tab!=="draft") && !ready;
    b.classList.toggle("locked", locked);
    b.setAttribute("aria-pressed", String(b.dataset.tab===ui.tab));
    b.title = locked ? "Opens once all 32 picks are in" : "";
  });
}
document.getElementById("tabs").addEventListener("click", e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  if(b.classList.contains("locked")){ toast("That opens once the draft is finished"); return; }
  ui.tab=b.dataset.tab; ui.tabTouched=true; render();
  if(ui.tab==="draft") focusSearch();
});

function render(){
  if(draftLocked() && ui.tab==="draft"){
    ui.tab = (SEASON.weeks.length || (LIVE.games||[]).some(g=>g.state==="in")) ? "season" : "leader";
  }
  const tab=ui.tab;
  const draftTab = tab==="draft";
  const setup = draftTab && S.phase==="setup";
  document.getElementById("setupView").classList.toggle("hide",!setup);
  document.getElementById("clockStrip").classList.toggle("hide",!(draftTab && !setup));
  document.getElementById("draftStage").classList.toggle("hide",!(draftTab && !setup));
  document.getElementById("seasonView").classList.toggle("hide",tab!=="season");
  document.getElementById("leaderView").classList.toggle("hide",tab!=="leader");
  document.body.classList.toggle("page-scroll", tab!=="draft");
  renderTabs();
  renderTopActions();
  if(draftTab){
    if(setup) renderSetup();
    else { renderClock(); renderBoard(); renderPool({noFlip:true}); }
  }
  else if(tab==="season") renderSeason();
  else renderLeader();
}

buildTiles();
load();
/* Family opening the link mid-season should land on the results, not the draw. */
if(SEASON.weeks && SEASON.weeks.length) ui.tab = "season";
render();
bootLive();
</script>
